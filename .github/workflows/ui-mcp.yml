name: UI MCP Tests

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Exposes window.__nap_store and test-mode timers so MCP scenarios
          # (beans/energy/boost/drift) are deterministic in CI. Matches ui-tests.yml.
          NEXT_PUBLIC_TEST_MODE: '1'

      - name: Start application
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for application
        run: |
          timeout=60
          elapsed=0
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "App failed to start"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Run MCP tests
        run: npm run test:mcp
        env:
          HEADFUL: 0
          E2E_BASE_URL: http://localhost:3000

      - name: Generate report
        run: npm run test:mcp:report
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-test-artifacts
          path: |
            artifacts/**
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-test-results
          path: |
            artifacts/*/results.json
            artifacts/report.md
          retention-days: 30
